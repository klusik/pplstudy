<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="t d">
  <title id="t">PFP-008 rychloměr</title>
  <desc id="d">Studijní schéma barevných rozsahů rychloměru.</desc>
  <rect width="1000" height="540" fill="#f7fafc"/>
  <rect x="30" y="30" width="940" height="480" rx="20" fill="#fff" stroke="#d4e0e8" stroke-width="3"/>
  <text x="60" y="75" text-anchor="start" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#17384f">Rychloměr a provozní rozsahy</text>
<line x1="170" y1="330" x2="830" y2="330" stroke="#d7e2e9" stroke-width="18"/>
<line x1="250" y1="330" x2="650" y2="330" stroke="#4a8b55" stroke-width="18"/>
<line x1="650" y1="330" x2="790" y2="330" stroke="#d4ae3a" stroke-width="18"/>
<line x1="790" y1="300" x2="790" y2="360" stroke="#9a2732" stroke-width="8"/>
<text x="250" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#17384f">2</text>
<text x="650" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#17384f">4</text>
<text x="790" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#17384f">5</text>
