<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">Vzduchové hmoty podle místa původu</title><desc id="desc">Maritimní a kontinentální polární či tropická hmota se liší zejména teplotou a vlhkostí. Nejde o zeměpisnou mapu.</desc><!-- Author: Rudolf Klusal. Original educational diagram. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-dfac39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfac39"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="31" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">Vzduchové hmoty podle místa původu</text><rect x="35" y="55" width="730" height="250" rx="8" fill="#fff" stroke="#b8cbd7"/><rect x="55" y="91" width="690" height="89" rx="4" fill="#e5f1f9" stroke="none"/><rect x="55" y="180" width="690" height="89" rx="4" fill="#fce7d6" stroke="none"/><rect x="55" y="91" width="345" height="178" rx="0" fill="#c7e2ed" stroke="none"/><line x1="400" y1="91" x2="400" y2="269" stroke="#b8cbd7" stroke-width="2" /><line x1="55" y1="180" x2="745" y2="180" stroke="#b8cbd7" stroke-width="2" /><text x="220" y="81" font-size="15" font-weight="700" fill="#2376ae" text-anchor="middle">Oceán</text><text x="575" y="81" font-size="15" font-weight="700" fill="#198568" text-anchor="middle">Kontinent</text><text x="220" y="128" font-size="15" font-weight="700" fill="#18344d" text-anchor="middle">mP · chladný, vlhký</text><text x="575" y="128" font-size="15" font-weight="700" fill="#18344d" text-anchor="middle">cP · chladný, suchý</text><text x="220" y="220" font-size="15" font-weight="700" fill="#18344d" text-anchor="middle">mT · teplý, vlhký</text><text x="575" y="220" font-size="15" font-weight="700" fill="#18344d" text-anchor="middle">cT · teplý, suchý</text><text x="62" y="169" font-size="12" font-weight="400" fill="#60778a" text-anchor="start">polární oblast</text><text x="62" y="258" font-size="12" font-weight="400" fill="#60778a" text-anchor="start">tropická oblast</text><text x="400" y="337" font-size="13" font-weight="700" fill="#60778a" text-anchor="middle">Vlastnosti hmoty se během transportu mění výměnou tepla a vody s povrchem.</text></g></svg>
