<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">Rozhodování GO / NO-GO</title><desc id="desc">Průběžně ověřuj souvislou bezpečnou cestu, rezervy a alternativy; pokud není bezpečnost prokazatelná, změň plán nebo let odlož.</desc><!-- Author: Rudolf Klusal. Original educational diagram. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-dfac39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfac39"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="31" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">Rozhodování GO / NO-GO</text><rect x="35" y="55" width="730" height="255" rx="8" fill="#fff" stroke="#b8cbd7"/><rect x="255" y="73" width="290" height="55" rx="8" fill="#e5f1f9" stroke="#2376ae"/><text x="400" y="106" font-size="15" font-weight="700" fill="#18344d" text-anchor="middle">Bezpečná cesta v celém čase?</text><line x1="255" y1="101" x2="133" y2="163" stroke="#198568" stroke-width="3" marker-end="url(#arrow-198568)" stroke-linecap="round"/><line x1="545" y1="101" x2="667" y2="163" stroke="#b64d3b" stroke-width="3" marker-end="url(#arrow-b64d3b)" stroke-linecap="round"/><text x="179" y="130" font-size="13" font-weight="700" fill="#198568" text-anchor="start">ANO</text><text x="579" y="130" font-size="13" font-weight="700" fill="#b64d3b" text-anchor="start">NE / NEJISTÉ</text><rect x="56" y="164" width="230" height="64" rx="8" fill="#e3f3e9" stroke="#198568"/><text x="171" y="190" font-size="15" font-weight="700" fill="#198568" text-anchor="middle">GO s rezervami</text><text x="171" y="211" font-size="13" font-weight="400" fill="#18344d" text-anchor="middle">Průběžná kontrola</text><rect x="513" y="164" width="230" height="64" rx="8" fill="#fce7d6" stroke="#b64d3b"/><text x="628" y="190" font-size="15" font-weight="700" fill="#b64d3b" text-anchor="middle">Změň plán / NO-GO</text><text x="628" y="211" font-size="13" font-weight="400" fill="#18344d" text-anchor="middle">Nečekej na ztrátu úniku</text><line x1="171" y1="228" x2="171" y2="272" stroke="#60778a" stroke-width="2" marker-end="url(#arrow-60778a)" stroke-linecap="round"/><rect x="56" y="270" width="687" height="26" rx="4" fill="#f5f9fc" stroke="#b8cbd7"/><text x="400" y="288" font-size="14" font-weight="700" fill="#18344d" text-anchor="middle">Trasa · počasí · výkon · palivo · alternativy · osobní minima</text><text x="400" y="337" font-size="13" font-weight="700" fill="#60778a" text-anchor="middle">Nové informace za letu → nové rozhodnutí.</text></g></svg>
