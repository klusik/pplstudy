<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">Konvekční energie a její bariéra</title><desc id="desc">Schematické porovnání teploty částice a okolí: CIN brzdí počáteční výstup; nad LFC má teplejší částice kladný vztlak až k EL. Nejde o skutečný aerologický diagram.</desc><!-- Author: Rudolf Klusal. Original educational diagram. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-dfac39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfac39"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="31" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">Konvekční energie a její bariéra</text><rect x="35" y="55" width="730" height="255" rx="8" fill="#fff" stroke="#b8cbd7"/><line x1="85" y1="288" x2="85" y2="75" stroke="#60778a" stroke-width="3" marker-end="url(#arrow-60778a)" stroke-linecap="round"/><line x1="85" y1="288" x2="715" y2="288" stroke="#60778a" stroke-width="3" marker-end="url(#arrow-60778a)" stroke-linecap="round"/><text x="57" y="82" font-size="15" font-weight="700" fill="#18344d" text-anchor="start">h</text><text x="674" y="306" font-size="13" font-weight="400" fill="#18344d" text-anchor="start">teplota →</text><path d="M430 286 L390 233 L440 182 L365 104 L345 76" fill="none" stroke="#2376ae" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M430 286 L355 233 L440 182 L455 104 L345 76" fill="none" stroke="#b64d3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M430 286 L390 233 L440 182 L355 233 Z" fill="#e9c5b8" stroke="#b64d3b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><path d="M440 182 L365 104 L345 76 L455 104 Z" fill="#b9e1ca" stroke="#198568" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><text x="485" y="123" font-size="20" font-weight="700" fill="#198568" text-anchor="start">CAPE</text><text x="220" y="240" font-size="20" font-weight="700" fill="#b64d3b" text-anchor="start">CIN</text><line x1="85" y1="182" x2="705" y2="182" stroke="#60778a" stroke-width="1" stroke-dasharray="7 5"/><line x1="85" y1="76" x2="705" y2="76" stroke="#60778a" stroke-width="1" stroke-dasharray="7 5"/><text x="600" y="176" font-size="15" font-weight="700" fill="#18344d" text-anchor="start">LFC</text><text x="600" y="70" font-size="15" font-weight="700" fill="#18344d" text-anchor="start">EL</text><text x="100" y="322" font-size="13" font-weight="400" fill="#2376ae" text-anchor="start">Modrá: okolí</text><text x="315" y="322" font-size="13" font-weight="400" fill="#b64d3b" text-anchor="start">Červená: částice</text><text x="535" y="322" font-size="12" font-weight="400" fill="#18344d" text-anchor="start">Schéma bez číselné stupnice</text></g></svg>
