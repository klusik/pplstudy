<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">Čtyři typy meteorologické informace</title><desc id="desc">Pozorování popisuje stav, analýza jej propojuje, předpověď odhaduje vývoj a výstraha vymezuje nebezpečí.</desc><!-- Author: Rudolf Klusal. Original educational diagram. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-dfac39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfac39"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="31" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">Čtyři typy meteorologické informace</text><rect x="28" y="70" width="174" height="214" rx="8" fill="#fff" stroke="#b8cbd7"/><rect x="38" y="82" width="154" height="39" rx="5" fill="#2376ae" stroke="none"/><text x="115" y="106" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Pozorování</text><text x="115" y="159" font-size="13" font-weight="700" fill="#18344d" text-anchor="middle">METAR / SPECI</text><text x="115" y="182" font-size="12" font-weight="400" fill="#18344d" text-anchor="middle">Radar, družice</text><line x1="50" y1="206" x2="180" y2="206" stroke="#b8cbd7" stroke-width="1" /><text x="115" y="237" font-size="15" font-weight="700" fill="#2376ae" text-anchor="middle">Co je nyní?</text><rect x="218" y="70" width="174" height="214" rx="8" fill="#fff" stroke="#b8cbd7"/><rect x="228" y="82" width="154" height="39" rx="5" fill="#198568" stroke="none"/><text x="305" y="106" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Analýza</text><text x="305" y="159" font-size="13" font-weight="700" fill="#18344d" text-anchor="middle">Synoptická mapa</text><text x="305" y="182" font-size="12" font-weight="400" fill="#18344d" text-anchor="middle">Tlak, fronty</text><line x1="240" y1="206" x2="370" y2="206" stroke="#b8cbd7" stroke-width="1" /><text x="305" y="237" font-size="15" font-weight="700" fill="#198568" text-anchor="middle">Jaký je obraz?</text><rect x="408" y="70" width="174" height="214" rx="8" fill="#fff" stroke="#b8cbd7"/><rect x="418" y="82" width="154" height="39" rx="5" fill="#7958a0" stroke="none"/><text x="495" y="106" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Předpověď</text><text x="495" y="159" font-size="13" font-weight="700" fill="#18344d" text-anchor="middle">TAF, SWL, GAMET</text><text x="495" y="182" font-size="12" font-weight="400" fill="#18344d" text-anchor="middle">Čas, oblast, výška</text><line x1="430" y1="206" x2="560" y2="206" stroke="#b8cbd7" stroke-width="1" /><text x="495" y="237" font-size="15" font-weight="700" fill="#7958a0" text-anchor="middle">Co bude?</text><rect x="598" y="70" width="174" height="214" rx="8" fill="#fff" stroke="#b8cbd7"/><rect x="608" y="82" width="154" height="39" rx="5" fill="#b64d3b" stroke="none"/><text x="685" y="106" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Výstraha</text><text x="685" y="159" font-size="13" font-weight="700" fill="#18344d" text-anchor="middle">SIGMET / AIRMET</text><text x="685" y="182" font-size="12" font-weight="400" fill="#18344d" text-anchor="middle">Jev, oblast, platnost</text><line x1="620" y1="206" x2="750" y2="206" stroke="#b8cbd7" stroke-width="1" /><text x="685" y="237" font-size="15" font-weight="700" fill="#b64d3b" text-anchor="middle">Co hrozí?</text><text x="400" y="337" font-size="13" font-weight="700" fill="#60778a" text-anchor="middle">Vždy kontroluj datum, UTC a čas platnosti; ATIS doplňuje provozní údaje.</text></g></svg>
