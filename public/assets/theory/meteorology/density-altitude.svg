<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">Hustotní výška v horkém dni</title><desc id="desc">Letiště 457 m / 1500 ft, QNH 1003 hPa a OAT 30 °C; tlaková výška 539 m / 1770 ft a orientační DA 1216 m / 3990 ft.</desc><!-- Author: Rudolf Klusal. Original educational diagram. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-dfac39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfac39"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="31" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">Hustotní výška v horkém dni</text><rect x="38" y="55" width="724" height="255" rx="8" fill="#fff" stroke="#b8cbd7"/><line x1="110" y1="277" x2="710" y2="277" stroke="#198568" stroke-width="4" /><text x="52" y="299" font-size="13" font-weight="400" fill="#18344d" text-anchor="start">MSL</text><line x1="110" y1="222" x2="710" y2="222" stroke="#60778a" stroke-width="2" stroke-dasharray="7 5"/><line x1="110" y1="207" x2="710" y2="207" stroke="#2376ae" stroke-width="2" stroke-dasharray="7 5"/><line x1="110" y1="94" x2="710" y2="94" stroke="#b64d3b" stroke-width="3" stroke-dasharray="7 5"/><path d="M131 226 L153 220 L163 203 H170 L167 220 L194 223 L200 228 L167 232 L163 239 H157 L155 232 L135 230Z" fill="#18344d" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><text x="204" y="229" font-size="15" font-weight="700" fill="#18344d" text-anchor="start">Elevace 457 m / 1 500 ft</text><text x="204" y="192" font-size="15" font-weight="700" fill="#2376ae" text-anchor="start">PA ≈ 539 m / 1 770 ft</text><text x="204" y="85" font-size="20" font-weight="700" fill="#b64d3b" text-anchor="start">DA ≈ 1 216 m / 3 990 ft</text><line x1="675" y1="201" x2="675" y2="101" stroke="#b64d3b" stroke-width="4" marker-end="url(#arrow-b64d3b)" stroke-linecap="round"/><text x="449" y="148" font-size="15" font-weight="700" fill="#b64d3b" text-anchor="start">OAT +30 °C</text><text x="449" y="169" font-size="14" font-weight="400" fill="#18344d" text-anchor="start">ISA ≈ +11,5 °C</text><text x="400" y="337" font-size="13" font-weight="700" fill="#60778a" text-anchor="middle">Hustotní výška vyjadřuje výkonové podmínky, ne polohu letadla.</text></g></svg>
