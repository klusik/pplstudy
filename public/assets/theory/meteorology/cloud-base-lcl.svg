<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">Odhad základny termických kumulů</title><desc id="desc">Teplota stoupající částice klesá rychleji než její rosný bod, až do nasycení. Při spreadu 10 °C je odhad 1220 m nebo 4000 ft AGL.</desc><!-- Author: Rudolf Klusal. Original educational diagram. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-dfac39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfac39"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="31" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">Odhad základny termických kumulů</text><rect x="35" y="54" width="730" height="255" rx="8" fill="#fff" stroke="#b8cbd7"/><line x1="95" y1="279" x2="720" y2="279" stroke="#198568" stroke-width="4" /><line x1="95" y1="117" x2="720" y2="117" stroke="#2376ae" stroke-width="2" stroke-dasharray="7 5"/><g transform="translate(460 69) scale(1.5)"><path d="M0 38 C-10 20 10 10 24 16 C28 -5 54 -8 65 13 C82 -1 107 13 100 30 Q115 48 93 48 H13 Q0 48 0 38Z" fill="#fff" stroke="#b8cbd7" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /></g><line x1="260" y1="268" x2="260" y2="121" stroke="#b64d3b" stroke-width="4" marker-end="url(#arrow-b64d3b)" stroke-linecap="round"/><path d="M120 275 L260 117" fill="none" stroke="#b64d3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M195 275 L260 117" fill="none" stroke="#2376ae" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="102" y="269" font-size="15" font-weight="700" fill="#b64d3b" text-anchor="start">22 °C</text><text x="190" y="297" font-size="15" font-weight="700" fill="#2376ae" text-anchor="start">12 °C</text><text x="270" y="107" font-size="15" font-weight="700" fill="#18344d" text-anchor="start">T = Td · LCL</text><text x="325" y="147" font-size="20" font-weight="700" fill="#2376ae" text-anchor="start">≈ 1 220 m / 4 000 ft AGL</text><text x="325" y="177" font-size="15" font-weight="400" fill="#18344d" text-anchor="start">Spread 10 °C × 122 m/°C</text><text x="325" y="198" font-size="15" font-weight="400" fill="#18344d" text-anchor="start">nebo 10 × 400 ft/°C</text><text x="400" y="337" font-size="13" font-weight="700" fill="#60778a" text-anchor="middle">Odhad pro dobře promíchanou přízemní vrstvu a termické Cu.</text></g></svg>
