 x="687" y="279" font-size="13" font-weight="700" fill="#18344d" text-anchor="middle">věž a kovadlina</text><text x="400" y="337" font-size="13" font-weight="700" fill="#60778a" text-anchor="middle">Tvar je vodítko; oblak může být skrytý nebo neúplně viditelný.</text></g></svg>
