<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">Námraza ve Venturiho trubici</title><desc id="desc">Při poklesu tlaku a odpařování paliva se směs ochlazuje; led v nejužším místě omezuje průtok. Jde o schematický princip, nikoli schéma konkrétního karburátoru.</desc><!-- Author: Rudolf Klusal. Original educational diagram. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-dfac39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfac39"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="31" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">Námraza ve Venturiho trubici</text><rect x="35" y="55" width="730" height="253" rx="8" fill="#fff" stroke="#b8cbd7"/><path d="M75 112 H250 Q325 112 355 165 Q380 190 405 165 Q440 112 510 112 H720 V242 H510 Q440 242 405 200 Q380 181 355 200 Q325 242 250 242 H75 Z" fill="#e6eff5" stroke="#18344d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><line x1="95" y1="177" x2="270" y2="177" stroke="#2376ae" stroke-width="4" marker-end="url(#arrow-2376ae)" stroke-linecap="round"/><line x1="300" y1="177" x2="470" y2="177" stroke="#2376ae" stroke-width="5" marker-end="url(#arrow-2376ae)" stroke-linecap="round"/><line x1="485" y1="177" x2="690" y2="177" stroke="#2376ae" stroke-width="3" marker-end="url(#arrow-2376ae)" stroke-linecap="round"/><line x1="380" y1="70" x2="380" y2="159" stroke="#b64d3b" stroke-width="3" /><circle cx="380" cy="161" r="5" fill="#b64d3b" stroke="none"/><text x="395" y="94" font-size="13" font-weight="700" fill="#b64d3b" text-anchor="start">palivo</text><path d="M350 157 Q370 166 390 157 L412 165 L405 175 L355 175Z" fill="#a2d6ea" stroke="#2376ae" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M355 199 L405 199 L414 212 L386 209 L360 215Z" fill="#a2d6ea" stroke="#2376ae" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="80" y="95" font-size="15" font-weight="700" fill="#18344d" text-anchor="start">Vlhký vzduch</text><text x="508" y="95" font-size="15" font-weight="700" fill="#18344d" text-anchor="start">Do motoru</text><text x="295" y="264" font-size="14" font-weight="700" fill="#18344d" text-anchor="start">Venturi: pokles tlaku + výpar paliva</text><text x="295" y="286" font-size="14" font-weight="700" fill="#b64d3b" text-anchor="start">→ ochlazení, led zužuje průřez</text><text x="400" y="337" font-size="13" font-weight="700" fill="#60778a" text-anchor="middle">Klasická námraza karburátoru může vzniknout i při kladné OAT.</text></g></svg>
