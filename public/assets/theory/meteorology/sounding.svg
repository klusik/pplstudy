<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">Jak číst modelový vertikální profil</title><desc id="desc">Modelové křivky T a Td, inverze a nulová izoterma ve 2000 m nebo 6562 ft. Osy jsou numerické, nejedná se o skutečnou sondáž.</desc><!-- Author: Rudolf Klusal. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui,sans-serif"><text x="25" y="30" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">Jak číst modelový vertikální profil</text><rect x="160" y="80" width="450" height="210" rx="0" fill="#fff" stroke="#c2d2dd"/><text x="24" y="53" font-size="12" font-weight="700" fill="#18344d" text-anchor="start">Výška [km / ft]</text><line x1="160" y1="290" x2="610" y2="290" stroke="#c2d2dd" stroke-width="1" /><text x="147" y="294" font-size="12" font-weight="400" fill="#18344d" text-anchor="end">0 / 0</text><line x1="160" y1="220" x2="610" y2="220" stroke="#c2d2dd" stroke-width="1" /><text x="147" y="224" font-size="12" font-weight="400" fill="#18344d" text-anchor="end">1 / 3 281</text><line x1="160" y1="150" x2="610" y2="150" stroke="#c2d2dd" stroke-width="1" /><text x="147" y="154" font-size="12" font-weight="400" fill="#18344d" text-anchor="end">2 / 6 562</text><line x1="160" y1="80" x2="610" y2="80" stroke="#c2d2dd" stroke-width="1" /><text x="147" y="84" font-size="12" font-weight="400" fill="#18344d" text-anchor="end">3 / 9 843</text><line x1="235" y1="80" x2="235" y2="290" stroke="#c2d2dd" stroke-width="1" /><text x="235" y="311" font-size="12" font-weight="400" fill="#18344d" text-anchor="middle">-10 °C</text><line x1="385" y1="80" x2="385" y2="290" stroke="#c2d2dd" stroke-width="1" /><text x="385" y="311" font-size="12" font-weight="400" fill="#18344d" text-anchor="middle">0 °C</text><line x1="535" y1="80" x2="535" y2="290" stroke="#c2d2dd" stroke-width="1" /><text x="535" y="311" font-size="12" font-weight="400" fill="#18344d" text-anchor="middle">10 °C</text><path d="M535 290 L475 220 L520 192 L385 150 L265 80" fill="none" stroke="#b64d3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M520 290 L445 220 L415 192 L310 150 L175 80" fill="none" stroke="#2376ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="160" y1="150" x2="610" y2="150" stroke="#198568" stroke-width="1.5" stroke-dasharray="6 4"/><circle cx="385" cy="150" r="5" fill="#198568"/><text x="625" y="154" font-size="14" font-weight="700" fill="#198568" text-anchor="start">0 °C</text><text x="615" y="196" font-size="14" font-weight="700" fill="#b64d3b" text-anchor="start">inverze</text><text x="170" y="69" font-size="14" font-weight="700" fill="#b64d3b" text-anchor="start">T: teplota</text><text x="310" y="69" font-size="14" font-weight="700" fill="#2376ae" text-anchor="start">Td: rosný bod</text><text x="400" y="343" font-size="12" font-weight="400" fill="#60778a" text-anchor="middle">T a Td se blíží u země; ve 2 km / 6 562 ft je modelová nulová izoterma.</text></g></svg>
