<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">Jak číst modelový vertikální profil</title><desc id="desc">Názorný profil teploty T a rosného bodu Td, inverzní vrstva a nulová izoterma. Výšková osa uvádí km a ft; nejde o skutečnou sondáž.</desc><!-- Author: Rudolf Klusal. Original educational diagram. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-dfac39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfac39"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="31" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">Jak číst modelový vertikální profil</text><rect x="35" y="52" width="730" height="260" rx="8" fill="#fff" stroke="#b8cbd7"/><line x1="105" y1="285" x2="105" y2="68" stroke="#60778a" stroke-width="3" marker-end="url(#arrow-60778a)" stroke-linecap="round"/><line x1="105" y1="285" x2="715" y2="285" stroke="#60778a" stroke-width="3" marker-end="url(#arrow-60778a)" stroke-linecap="round"/><text x="55" y="73" font-size="12" font-weight="400" fill="#18344d" text-anchor="start">výška</text><text x="645" y="305" font-size="12" font-weight="400" fill="#18344d" text-anchor="start">teplota →</text><line x1="106" y1="285" x2="695" y2="285" stroke="#b8cbd7" stroke-width="1" /><text x="99" y="289" font-size="10" font-weight="400" fill="#18344d" text-anchor="end">0 m / 0 ft</text><line x1="106" y1="210" x2="695" y2="210" stroke="#b8cbd7" stroke-width="1" /><text x="99" y="214" font-size="10" font-weight="400" fill="#18344d" text-anchor="end">1 km / 3 281 ft</text><line x1="106" y1="135" x2="695" y2="135" stroke="#b8cbd7" stroke-width="1" /><text x="99" y="139" font-size="10" font-weight="400" fill="#18344d" text-anchor="end">2 km / 6 562 ft</text><line x1="106" y1="70" x2="695" y2="70" stroke="#b8cbd7" stroke-width="1" /><text x="99" y="74" font-size="10" font-weight="400" fill="#18344d" text-anchor="end">3 km / 9 843 ft</text><path d="M465 285 L405 210 L460 178 L350 135 L270 70" fill="none" stroke="#b64d3b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M440 285 L385 210 L360 178 L250 135 L190 70" fill="none" stroke="#2376ae" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="480" y="174" font-size="15" font-weight="700" fill="#b64d3b" text-anchor="start">inverze</text><text x="465" y="260" font-size="15" font-weight="700" fill="#b64d3b" text-anchor="start">T</text><text x="350" y="235" font-size="15" font-weight="700" fill="#2376ae" text-anchor="start">Td</text><line x1="108" y1="135" x2="695" y2="135" stroke="#198568" stroke-width="2" stroke-dasharray="7 5"/><text x="550" y="127" font-size="13" font-weight="400" fill="#198568" text-anchor="start">příklad izotermy 0 °C</text><text x="400" y="337" font-size="13" font-weight="700" fill="#60778a" text-anchor="middle">Modelové křivky: sleduj T, Td, inverzi, nulovou izotermu a vítr.</text></g></svg>
