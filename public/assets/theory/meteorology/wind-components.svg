<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">Rozklad protivětru a boční složky</title><desc id="desc">Pro úhel 30° mezi osou dráhy a směrem větru 16 kt vychází čelní složka 13,9 kt (7,2 m/s) a boční 8 kt (4,1 m/s).</desc><!-- Author: Rudolf Klusal. Original educational diagram. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-dfac39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfac39"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="31" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">Rozklad protivětru a boční složky</text><rect x="35" y="55" width="730" height="251" rx="8" fill="#fff" stroke="#b8cbd7"/><rect x="80" y="164" width="345" height="48" rx="2" fill="#5b7181" stroke="none"/><line x1="90" y1="188" x2="415" y2="188" stroke="#fff" stroke-width="2" stroke-dasharray="7 5"/><text x="95" y="193" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">27</text><text x="410" y="193" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">09</text><path d="M259 192 L281 186 L291 169 H298 L295 186 L322 189 L328 194 L295 198 L291 205 H285 L283 198 L263 196Z" fill="#18344d" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><line x1="425" y1="188" x2="585" y2="188" stroke="#2376ae" stroke-width="3" marker-end="url(#arrow-2376ae)" stroke-linecap="round"/><line x1="425" y1="188" x2="425" y2="280" stroke="#b64d3b" stroke-width="3" marker-end="url(#arrow-b64d3b)" stroke-linecap="round"/><line x1="425" y1="188" x2="585" y2="280" stroke="#18344d" stroke-width="4" marker-end="url(#arrow-18344d)" stroke-linecap="round"/><line x1="585" y1="188" x2="585" y2="280" stroke="#60778a" stroke-width="1" stroke-dasharray="7 5"/><line x1="425" y1="280" x2="585" y2="280" stroke="#60778a" stroke-width="1" stroke-dasharray="7 5"/><text x="470" y="178" font-size="15" font-weight="700" fill="#2376ae" text-anchor="start">13,9 kt / 7,2 m/s</text><text x="435" y="248" font-size="15" font-weight="700" fill="#b64d3b" text-anchor="start">8 kt / 4,1 m/s</text><text x="545" y="263" font-size="15" font-weight="700" fill="#18344d" text-anchor="start">16 kt</text><path d="M475 188 A50 50 0 0 1 468 213" fill="none" stroke="#60778a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="483" y="209" font-size="12" font-weight="400" fill="#18344d" text-anchor="start">30°</text><text x="81" y="98" font-size="19" font-weight="700" fill="#18344d" text-anchor="start">Dráha 270° · vítr 240°/16 kt</text><text x="81" y="125" font-size="12" font-weight="400" fill="#18344d" text-anchor="start">Složky vyjadřují velikost, vektor proudění směřuje od zdroje k letadlu.</text><text x="400" y="337" font-size="13" font-weight="700" fill="#60778a" text-anchor="middle">Před výpočtem sjednoť referenci skutečného nebo magnetickéh