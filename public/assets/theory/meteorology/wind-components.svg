<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">Rozklad protivětru a boční složky</title><desc id="desc">Dráha má směr 270°, vítr přichází z 240° rychlostí 16 kt. Protivítr 13,9 kt (7,2 m/s), boční složka zleva 8 kt (4,1 m/s). Sever je nahoře.</desc><!-- Author: Rudolf Klusal. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui,sans-serif"><text x="25" y="30" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">Rozklad protivětru a boční složky</text><rect x="35" y="55" width="730" height="251" rx="10" fill="#fff" stroke="#c2d2dd"/><rect x="75" y="162" width="540" height="52" rx="3" fill="#637987" stroke="none"/><line x1="85" y1="188" x2="605" y2="188" stroke="#fff" stroke-width="2" stroke-dasharray="8 5"/><text x="91" y="193" font-size="13" font-weight="700" fill="#fff" text-anchor="start">09</text><text x="596" y="193" font-size="13" font-weight="700" fill="#fff" text-anchor="end">27</text><path d="M325 188 l30 -5 18 -24 h7 l-8 24 42 4 v4 l-42 4 8 24 h-7 l-18 -24 -30 -5 z" fill="#18344d" stroke="#18344d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><line x1="315" y1="145" x2="220" y2="145" stroke="#18344d" stroke-width="3" marker-end="url(#arrow-18344d)"/><text x="270" y="132" font-size="14" font-weight="700" fill="#18344d" text-anchor="middle">Směr letu 270°</text><line x1="104" y1="274" x2="270" y2="178" stroke="#b64d3b" stroke-width="4" marker-end="url(#arrow-b64d3b)"/><line x1="104" y1="274" x2="270" y2="274" stroke="#2376ae" stroke-width="2" stroke-dasharray="5 4"/><line x1="270" y1="274" x2="270" y2="178" stroke="#2376ae" stroke-width="2" stroke-dasharray="5 4"/><line x1="104" y1="274" x2="270" y2="274" stroke="#2376ae" stroke-width="3" marker-end="url(#arrow-2376ae)"/><line x1="270" y1="274" x2="270" y2="178" stroke="#198568" stroke-width="3" marker-end="url(#arrow-198568)"/><text x="130" y="254" font-size="14" font-weight="700" fill="#b64d3b" text-anchor="start">vítr z 240°</text><text x="118" y="296" font-size="14" font-weight="700" fill="#2376ae" text-anchor="start">13,9 kt / 7,2 m/s</text><text x="281" y="243" font-size="14" font-weight="700" fill="#198568" text-anchor="start">8 kt / 4,1 m/s</text><text x="154" y="269" font-size="12" font-weight="400" fill="#18344d" text-anchor="start">30°</text><line x1="690" y1="133" x2="690" y2="77" stroke="#60778a" stroke-width="2" marker-end="url(#arrow-60778a)"/><text x="690" y="72" font-size="14" font-weight="700" fill="#18344d" text-anchor="middle">N</text><text x="430" y="89" font-size="18" font-weight="700" fill="#b64d3b" text-anchor="start">16 kt · zleva</text><text x="430" y="112" font-size="14" font-weight="700" fill="#18344d" text-anchor="start">Δ = 30°</text><text x="400" y="338" font-size="13" font-weight="400" fill="#60778a" text-anchor="middle">Vektor proudění míří k SV; protivítr brzdí pohyb k západu, boční vítr je zleva.</text></g></svg>
