<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">Fén a teplotní výpočet</title><desc id="desc">Vzduch stoupá o 1000 m nenasycený a dalších 1000 m nasycený, po ztrátě kondenzátu sestupuje o 2000 m. Přibližné teploty 15, 5, −1 a 19 °C.</desc><!-- Author: Rudolf Klusal. Original educational diagram. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-dfac39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfac39"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="31" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">Fén a teplotní výpočet</text><rect x="35" y="55" width="730" height="250" rx="8" fill="#fff" stroke="#b8cbd7"/><path d="M45 285 L115 278 L400 87 L690 278 L755 285 Z" fill="#abc2a7" stroke="#198568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><line x1="55" y1="192" x2="740" y2="192" stroke="#b8cbd7" stroke-width="1" stroke-dasharray="7 5"/><text x="62" y="183" font-size="13" font-weight="400" fill="#18344d" text-anchor="start">1 000 m / 3 281 ft</text><text x="445" y="76" font-size="13" font-weight="700" fill="#18344d" text-anchor="start">2 000 m / 6 562 ft</text><path d="M103 265 L258 177 L390 93" fill="none" stroke="#2376ae" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-2376ae)"/><path d="M411 93 L691 265" fill="none" stroke="#b64d3b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-b64d3b)"/><g transform="translate(285 113) scale(1.05)"><path d="M0 38 C-10 20 10 10 24 16 C28 -5 54 -8 65 13 C82 -1 107 13 100 30 Q115 48 93 48 H13 Q0 48 0 38Z" fill="#fff" stroke="#b8cbd7" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /></g><line x1="310" y1="159" x2="305" y2="176" stroke="#2376ae" stroke-width="2" /><line x1="324" y1="159" x2="319" y2="176" stroke="#2376ae" stroke-width="2" /><line x1="338" y1="159" x2="333" y2="176" stroke="#2376ae" stroke-width="2" /><line x1="352" y1="159" x2="347" y2="176" stroke="#2376ae" stroke-width="2" /><text x="79" y="253" font-size="19" font-weight="700" fill="#18344d" text-anchor="start">+15 °C</text><text x="221" y="153" font-size="17" font-weight="700" fill="#2376ae" text-anchor="start">+5 °C</text><text x="360" y="73" font-size="17" font-weight="700" fill="#2376ae" text-anchor="start">−1 °C</text><text x="645" y="253" font-size="19" font-weight="700" fill="#b64d3b" text-anchor="start">+19 °C</text><text x="105" y="215" font-size="13" font-weight="400" fill="#2376ae" text-anchor="start">1 °C / 100 m</text><text x="105" y="232" font-size="13" font-weight="400" fill="#2376ae" text-anchor="start">≈ 3 °C / 1 000 ft</text><text x="65" y="75" font-size="13" font-weight="400" fill="#2376ae" text-anchor="start">0,6 °C / 100 m (výstup)</text><text x="65" y="92" font-size="13" font-weight="400" fill="#2376ae" text-anchor="start">≈ 1,8 °C / 1 000 ft</text><text x="514" y="216" font-size="13" font-weight="400" fill="#b64d3b" text-anchor="start">1 °C / 100 m</text><text x="514" y="233" font-size="13" font-weight="400" fill="#b64d3b" text-anchor="start">≈ 3 °C / 1 000 ft</text><text x="400" y="337" font-size="13" font-weight="700" fill="#60778a" text-anchor="middle">Zjednodušený termodynamický příklad se ztrátou kondenzátu.</text></g></svg>
