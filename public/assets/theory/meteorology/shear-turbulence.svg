<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">Střih větru a mechanická turbulence</title><desc id="desc">Rychlejší proudění ve vyšší vrstvě a vířivé proudy za překážkami; střih a turbulence jsou příbuzné, ale odlišné jevy.</desc><!-- Author: Rudolf Klusal. Original educational diagram. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-dfac39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfac39"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="31" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">Střih větru a mechanická turbulence</text><rect x="35" y="55" width="730" height="251" rx="8" fill="#fff" stroke="#b8cbd7"/><path d="M45 280 H755 V305 H45Z" fill="#abc2a7" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><path d="M45 280 L180 280 L220 210 L290 280Z" fill="#abc2a7" stroke="#198568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="405" y="165" width="28" height="115" rx="0" fill="#718c9a" stroke="#60778a"/><line x1="75" y1="120" x2="720" y2="120" stroke="#2376ae" stroke-width="5" marker-end="url(#arrow-2376ae)" stroke-linecap="round"/><line x1="75" y1="242" x2="152" y2="242" stroke="#2376ae" stroke-width="3" marker-end="url(#arrow-2376ae)" stroke-linecap="round"/><line x1="310" y1="245" x2="370" y2="245" stroke="#2376ae" stroke-width="2" marker-end="url(#arrow-2376ae)" stroke-linecap="round"/><path d="M300 202 C328 176 370 203 346 224 C322 245 286 221 300 202Z" fill="none" stroke="#b64d3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M465 202 C508 175 549 205 521 231 C493 250 453 226 465 202Z" fill="none" stroke="#b64d3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="45" y1="160" x2="755" y2="160" stroke="#7958a0" stroke-width="2" stroke-dasharray="7 5"/><text x="80" y="151" font-size="15" font-weight="700" fill="#2376ae" text-anchor="start">Rychlejší proudění nahoře</text><text x="505" y="154" font-size="13" font-weight="700" fill="#7958a0" text-anchor="start">střih vrstvy</text><text x="303" y="273" font-size="14" font-weight="700" fill="#b64d3b" text-anchor="start">rotory / víry</text><text x="400" y="337" font-size="13" font-weight="700" fill="#60778a" text-anchor="middle">Střih = změna vektoru větru v prostoru; turbulence = nepravidelné víry.</text></g></svg>
