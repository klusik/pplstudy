<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">Místní zesílení mistrálu a bóry</title><desc id="desc">Mistrál je usměrňován údolím Rhôny směrem k moři; bóra může prudce sestupovat z pevniny a hor k Jadranu.</desc><!-- Author: Rudolf Klusal. Original educational diagram. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-dfac39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfac39"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="31" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">Místní zesílení mistrálu a bóry</text><rect x="28" y="55" width="360" height="251" rx="8" fill="#fff" stroke="#b8cbd7"/><text x="208" y="80" font-size="16" font-weight="700" fill="#18344d" text-anchor="middle">Mistrál</text><rect x="412" y="55" width="360" height="251" rx="8" fill="#fff" stroke="#b8cbd7"/><text x="592" y="80" font-size="16" font-weight="700" fill="#18344d" text-anchor="middle">Bóra</text><rect x="40" y="231" width="336" height="58" rx="0" fill="#e5f1f9" stroke="none"/><path d="M43 105 L150 93 L164 170 L124 231 H43Z" fill="#abc2a7" stroke="#198568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M372 103 L260 95 L242 167 L285 231 H372Z" fill="#abc2a7" stroke="#198568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><line x1="206" y1="111" x2="206" y2="249" stroke="#2376ae" stroke-width="7" marker-end="url(#arrow-2376ae)" stroke-linecap="round"/><text x="219" y="152" font-size="12" font-weight="400" fill="#18344d" text-anchor="start">údolí Rhôny</text><text x="208" y="278" font-size="13" font-weight="700" fill="#18344d" text-anchor="middle">Středozemní moře</text><rect x="425" y="215" width="330" height="74" rx="0" fill="#e5f1f9" stroke="none"/><path d="M425 105 L600 100 L690 174 L755 205 V216 L425 216Z" fill="#abc2a7" stroke="#198568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M676 109 L630 160 L548 217" fill="none" stroke="#2376ae" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-2376ae)"/><text x="444" y="128" font-size="13" font-weight="700" fill="#18344d" text-anchor="start">Pevnina / hory</text><text x="446" y="267" font-size="15" font-weight="700" fill="#18344d" text-anchor="start">Jadran</text><text x="620" y="246" font-size="15" font-weight="700" fill="#b64d3b" text-anchor="start">nárazy</text><text x="400" y="337" font-size="13" font-weight="700" fill="#60778a" text-anchor="middle">Schematická topografie, nikoliv navigační mapa; vítr zesiluje v členitém terénu.</text></g></svg>
