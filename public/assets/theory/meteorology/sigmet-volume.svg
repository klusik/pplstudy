<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">Výstražná oblast ve třech rozměrech</title><desc id="desc">Modelová plocha v rámci FIR a příklad výstrahy mezi FL050 a FL100. Metrické převody představují tlakovou výšku, nikoli skutečnou AMSL.</desc><!-- Author: Rudolf Klusal. Original educational diagram. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-dfac39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfac39"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="31" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">Výstražná oblast ve třech rozměrech</text><rect x="35" y="55" width="730" height="252" rx="8" fill="#fff" stroke="#b8cbd7"/><path d="M80 98 L200 79 L362 129 L385 241 L235 277 L95 230Z" fill="#e5f1f9" stroke="#2376ae" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M186 140 L280 112 L353 175 L310 235 L207 206Z" fill="#f3c6b8" stroke="#b64d3b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/><g transform="translate(232 140) scale(0.8)"><path d="M0 38 C-10 20 10 10 24 16 C28 -5 54 -8 65 13 C82 -1 107 13 100 30 Q115 48 93 48 H13 Q0 48 0 38Z" fill="#d1dce3" stroke="#b8cbd7" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /></g><line x1="245" y1="179" x2="240" y2="196" stroke="#2376ae" stroke-width="2" /><line x1="259" y1="179" x2="254" y2="196" stroke="#2376ae" stroke-width="2" /><line x1="273" y1="179" x2="268" y2="196" stroke="#2376ae" stroke-width="2" /><line x1="287" y1="179" x2="282" y2="196" stroke="#2376ae" stroke-width="2" /><line x1="287" y1="161" x2="341" y2="135" stroke="#b64d3b" stroke-width="3" marker-end="url(#arrow-b64d3b)" stroke-linecap="round"/><text x="75" y="88" font-size="14" font-weight="700" fill="#2376ae" text-anchor="start">FIR / oblast</text><text x="108" y="259" font-size="13" font-weight="700" fill="#b64d3b" text-anchor="start">SIGMET: vymezený jev</text><line x1="420" y1="79" x2="420" y2="282" stroke="#b8cbd7" stroke-width="2" /><text x="445" y="90" font-size="15" font-weight="700" fill="#18344d" text-anchor="start">Vertikální rozsah</text><rect x="465" y="112" width="254" height="160" rx="4" fill="#e5f1f9" stroke="none"/><rect x="465" y="148" width="254" height="69" rx="2" fill="#f3c6b8" stroke="#b64d3b"/><text x="472" y="143" font-size="13" font-weight="400" fill="#18344d" text-anchor="start">FL100 ≈ 3 048 m / 10 000 ft</text><text x="472" y="181" font-size="14" font-weight="700" fill="#b64d3b" text-anchor="start">Modelová oblast výstrahy</text><text x="472" y="236" font-size="13" font-weight="400" fill="#18344d" text-anchor="start">FL050 ≈ 1 524 m / 5 000 ft</text><text x="400" y="337" font-size="13" font-weight="700" fill="#60778a" text-anchor="middle">SIGMET: oblast + čas + hladiny + druh jevu; ATIS se týká provozu letiště.</text></g></svg>
