<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">Základna oblaků versus ceiling</title><desc id="desc">Nízké jednotlivé oblaky FEW008 nejsou ceiling; nejnižší BKN015 udává 457 m / 1500 ft nad letištěm.</desc><!-- Author: Rudolf Klusal. Original educational diagram. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-dfac39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfac39"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="31" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">Základna oblaků versus ceiling</text><rect x="35" y="54" width="730" height="248" rx="8" fill="#fff" stroke="#b8cbd7"/><line x1="55" y1="275" x2="745" y2="275" stroke="#198568" stroke-width="3" /><g transform="translate(95 164) scale(0.75)"><path d="M0 38 C-10 20 10 10 24 16 C28 -5 54 -8 65 13 C82 -1 107 13 100 30 Q115 48 93 48 H13 Q0 48 0 38Z" fill="#fff" stroke="#b8cbd7" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /></g><g transform="translate(300 94) scale(1)"><path d="M0 38 C-10 20 10 10 24 16 C28 -5 54 -8 65 13 C82 -1 107 13 100 30 Q115 48 93 48 H13 Q0 48 0 38Z" fill="#fff" stroke="#b8cbd7" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /></g><g transform="translate(400 94) scale(1)"><path d="M0 38 C-10 20 10 10 24 16 C28 -5 54 -8 65 13 C82 -1 107 13 100 30 Q115 48 93 48 H13 Q0 48 0 38Z" fill="#fff" stroke="#b8cbd7" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /></g><g transform="translate(500 94) scale(1)"><path d="M0 38 C-10 20 10 10 24 16 C28 -5 54 -8 65 13 C82 -1 107 13 100 30 Q115 48 93 48 H13 Q0 48 0 38Z" fill="#fff" stroke="#b8cbd7" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /></g><line x1="55" y1="200" x2="745" y2="200" stroke="#60778a" stroke-width="1" stroke-dasharray="7 5"/><line x1="55" y1="142" x2="745" y2="142" stroke="#2376ae" stroke-width="2" stroke-dasharray="7 5"/><text x="65" y="192" font-size="14" font-weight="700" fill="#18344d" text-anchor="start">FEW008 = 244 m / 800 ft</text><text x="65" y="133" font-size="16" font-weight="700" fill="#2376ae" text-anchor="start">BKN015 = 457 m / 1 500 ft</text><line x1="660" y1="272" x2="660" y2="144" stroke="#2376ae" stroke-width="4" marker-end="url(#arrow-2376ae)" stroke-linecap="round"/><text x="520" y="245" font-size="15" font-weight="700" fill="#2376ae" text-anchor="start">CEILING</text><text x="520" y="264" font-size="15" font-weight="700" fill="#2376ae" text-anchor="start">457 m / 1 500 ft</text><text x="400" y="337" font-size="13" font-weight="700" fill="#60778a" text-anchor="middle">Výšky AGL vůči letišti · FEW může být níže, aniž tvoří ceiling.</text></g></svg>
