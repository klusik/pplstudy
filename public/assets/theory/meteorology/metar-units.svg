<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">METAR: vodorovná a svislá vzdálenost</title><desc id="desc">Dohlednost a RVR v metrech, základny a vertikální dohlednost ve stovkách stop; obě jednotky v dekódování.</desc><!-- Author: Rudolf Klusal. Original educational diagram. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-dfac39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfac39"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="31" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">METAR: vodorovná a svislá vzdálenost</text><rect x="30" y="55" width="360" height="247" rx="8" fill="#fff" stroke="#b8cbd7"/><text x="210" y="80" font-size="16" font-weight="700" fill="#18344d" text-anchor="middle">Dohlednost / RVR</text><rect x="410" y="55" width="360" height="247" rx="8" fill="#fff" stroke="#b8cbd7"/><text x="590" y="80" font-size="16" font-weight="700" fill="#18344d" text-anchor="middle">Oblačnost / vertikální dohlednost</text><line x1="65" y1="154" x2="336" y2="154" stroke="#198568" stroke-width="4" marker-end="url(#arrow-198568)" stroke-linecap="round"/><text x="55" y="115" font-size="15" font-weight="700" fill="#198568" text-anchor="start">9999 = nejméně 10 000 m</text><text x="55" y="137" font-size="13" font-weight="400" fill="#18344d" text-anchor="start">≈ 32 808 ft (jen převod)</text><text x="55" y="218" font-size="15" font-weight="700" fill="#2376ae" text-anchor="start">R24/0800U</text><text x="55" y="239" font-size="14" font-weight="400" fill="#18344d" text-anchor="start">800 m (2 625 ft), tendence ↑</text><line x1="432" y1="270" x2="748" y2="270" stroke="#198568" stroke-width="3" /><g transform="translate(540 95) scale(1.2)"><path d="M0 38 C-10 20 10 10 24 16 C28 -5 54 -8 65 13 C82 -1 107 13 100 30 Q115 48 93 48 H13 Q0 48 0 38Z" fill="#fff" stroke="#b8cbd7" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /></g><line x1="432" y1="153" x2="748" y2="153" stroke="#2376ae" stroke-width="2" stroke-dasharray="7 5"/><line x1="710" y1="268" x2="710" y2="155" stroke="#2376ae" stroke-width="3" marker-end="url(#arrow-2376ae)" stroke-linecap="round"/><text x="430" y="144" font-size="15" font-weight="700" fill="#2376ae" text-anchor="start">BKN015</text><text x="445" y="190" font-size="15" font-weight="700" fill="#18344d" text-anchor="start">457 m / 1 500 ft AGL</text><text x="445" y="237" font-size="13" font-weight="400" fill="#18344d" text-anchor="start">VV002 = 61 m / 200 ft</text><text x="400" y="337" font-size="13" font-weight="700" fill="#60778a" text-anchor="middle">Kód se nemění při převodu. V provozu používej originální jednotky zprávy.</text></g></svg>
