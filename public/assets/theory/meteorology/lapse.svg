<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">Teplotní gradienty: metr i stopa</title><desc id="desc">Graf se společnou počáteční teplotou 20 °C; suchá adiabata 0,98 °C/100 m, ISA 0,65 °C/100 m a zjednodušená nasycená adiabata 0,6 °C/100 m. Osa zobrazuje km a ft.</desc><!-- Author: Rudolf Klusal. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui,sans-serif"><text x="25" y="30" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">Teplotní gradienty: metr i stopa</text><rect x="142" y="73" width="342" height="225" rx="0" fill="#fff" stroke="#c2d2dd"/><text x="25" y="52" font-size="12" font-weight="700" fill="#18344d" text-anchor="start">Výška [km / ft]</text><line x1="142" y1="298" x2="484" y2="298" stroke="#c2d2dd" stroke-width="1" /><text x="131" y="302" font-size="12" font-weight="400" fill="#18344d" text-anchor="end">0 / 0</text><line x1="142" y1="223" x2="484" y2="223" stroke="#c2d2dd" stroke-width="1" /><text x="131" y="227" font-size="12" font-weight="400" fill="#18344d" text-anchor="end">1 / 3 281</text><line x1="142" y1="148" x2="484" y2="148" stroke="#c2d2dd" stroke-width="1" /><text x="131" y="152" font-size="12" font-weight="400" fill="#18344d" text-anchor="end">2 / 6 562</text><line x1="142" y1="73" x2="484" y2="73" stroke="#c2d2dd" stroke-width="1" /><text x="131" y="77" font-size="12" font-weight="400" fill="#18344d" text-anchor="end">3 / 9 843</text><line x1="161" y1="73" x2="161" y2="298" stroke="#c2d2dd" stroke-width="1" /><text x="161" y="322" font-size="12" font-weight="400" fill="#18344d" text-anchor="middle">-10 °C</text><line x1="256" y1="73" x2="256" y2="298" stroke="#c2d2dd" stroke-width="1" /><text x="256" y="322" font-size="12" font-weight="400" fill="#18344d" text-anchor="middle">0 °C</text><line x1="351" y1="73" x2="351" y2="298" stroke="#c2d2dd" stroke-width="1" /><text x="351" y="322" font-size="12" font-weight="400" fill="#18344d" text-anchor="middle">10 °C</text><line x1="446" y1="73" x2="446" y2="298" stroke="#c2d2dd" stroke-width="1" /><text x="446" y="322" font-size="12" font-weight="400" fill="#18344d" text-anchor="middle">20 °C</text><path d="M446 298 L166.7 73" fill="none" stroke="#2376ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="501" y="63" width="274" height="73" rx="7" fill="#fff" stroke="#c2d2dd"/><line x1="512" y1="81" x2="543" y2="81" stroke="#2376ae" stroke-width="4" /><text x="553" y="86" font-size="14" font-weight="700" fill="#2376ae" text-anchor="start">DALR</text><text x="512" y="106" font-size="15" font-weight="700" fill="#18344d" text-anchor="start">0,98 °C/100 m</text><text x="512" y="125" font-size="13" font-weight="400" fill="#18344d" text-anchor="start">≈ 3 °C/1 000 ft</text><path d="M446 298 L260.75 73" fill="none" stroke="#60778a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="501" y="146" width="274" height="73" rx="7" fill="#fff" stroke="#c2d2dd"/><line x1="512" y1="164" x2="543" y2="164" stroke="#60778a" stroke-width="4" /><text x="553" y="169" font-size="14" font-weight="700" fill="#60778a" text-anchor="start">ISA</text><text x="512" y="189" font-size="15" font-weight="700" fill="#18344d" text-anchor="start">0,65 °C/100 m</text><text x="512" y="208" font-size="13" font-weight="400" fill="#18344d" text-anchor="start">≈ 2 °C/1 000 ft</text><path d="M446 298 L275 73" fill="none" stroke="#b64d3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="501" y="229" width="274" height="73" rx="7" fill="#fff" stroke="#c2d2dd"/><line x1="512" y1="247" x2="543" y2="247" stroke="#b64d3b" stroke-width="4" /><text x="553" y="252" font-size="14" font-weight="700" fill="#b64d3b" text-anchor="start">SALR</text><text x="512" y="272" font-size="15" font-weight="700" fill="#18344d" text-anchor="start">≈ 0,6 °C/100 m</text><text x="512" y="291" font-size="13" font-weight="400" fill="#18344d" text-anchor="start">≈ 1,8 °C/1 000 ft</text><text x="400" y="347" font-size="13" font-weight="400" fill="#60778a" text-anchor="middle">Stejná počáteční teplota; SALR je proměnný, zde pouze modelový.</text></g></svg>
