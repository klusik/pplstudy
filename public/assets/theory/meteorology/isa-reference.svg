<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">ISA: referenční hodnoty</title><desc id="desc">Standardní tlak, teplota a hustota na hladině moře; teplota se s výškou snižuje o 0,65 °C na 100 m, přibližně 2 °C na 1 000 ft.</desc><!-- Author: Rudolf Klusal. Original educational diagram. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-dfac39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfac39"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="31" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">ISA: referenční hodnoty</text><rect x="35" y="55" width="730" height="245" rx="8" fill="#fff" stroke="#b8cbd7"/><text x="400" y="80" font-size="16" font-weight="700" fill="#18344d" text-anchor="middle">Standardní atmosféra na MSL</text><rect x="55" y="100" width="220" height="100" rx="8" fill="#e5f1f9" stroke="none"/><text x="165" y="143" font-size="23" font-weight="700" fill="#2376ae" text-anchor="middle">1013,25 hPa</text><text x="165" y="170" font-size="14" font-weight="400" fill="#18344d" text-anchor="middle">Tlak</text><rect x="290" y="100" width="220" height="100" rx="8" fill="#e5f1f9" stroke="none"/><text x="400" y="143" font-size="23" font-weight="700" fill="#2376ae" text-anchor="middle">+15 °C</text><text x="400" y="170" font-size="14" font-weight="400" fill="#18344d" text-anchor="middle">Teplota</text><rect x="525" y="100" width="220" height="100" rx="8" fill="#e5f1f9" stroke="none"/><text x="635" y="143" font-size="23" font-weight="700" fill="#2376ae" text-anchor="middle">1,225 kg/m³</text><text x="635" y="170" font-size="14" font-weight="400" fill="#18344d" text-anchor="middle">Hustota</text><text x="400" y="242" font-size="23" font-weight="700" fill="#b64d3b" text-anchor="middle">0,65 °C / 100 m ≈ 2 °C / 1 000 ft</text><text x="400" y="270" font-size="14" font-weight="400" fill="#18344d" text-anchor="middle">Pokles teploty v troposféře ISA</text><text x="400" y="337" font-size="13" font-weight="700" fill="#60778a" text-anchor="middle">Modelová atmosféra, nikoli skutečná předpověď</text></g></svg>
