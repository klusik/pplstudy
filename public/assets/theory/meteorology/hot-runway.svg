<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">Horký den, krátká dráha a překážka</title><desc id="desc">Modelové letiště s vysokou hustotní výškou; výkonnost musí pokrýt rozjezd, vzletovou vzdálenost i stoupání nad překážky. Není v měřítku.</desc><!-- Author: Rudolf Klusal. Original educational diagram. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-dfac39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfac39"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="31" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">Horký den, krátká dráha a překážka</text><rect x="35" y="55" width="730" height="255" rx="8" fill="#fff" stroke="#b8cbd7"/><circle cx="703" cy="97" r="24" fill="#dfac39" stroke="none"/><text x="55" y="87" font-size="18" font-weight="700" fill="#b64d3b" text-anchor="start">OAT +30 °C · QNH 1003 hPa</text><path d="M45 270 H490 L755 196 V298 H45Z" fill="#abc2a7" stroke="#198568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="62" y="261" width="420" height="9" rx="0" fill="#657c89" stroke="none"/><path d="M86 253 L108 247 L118 230 H125 L122 247 L149 250 L155 255 L122 259 L118 266 H112 L110 259 L90 257Z" fill="#18344d" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><line x1="157" y1="254" x2="458" y2="254" stroke="#18344d" stroke-width="4" marker-end="url(#arrow-18344d)" stroke-linecap="round"/><path d="M458 253 Q533 226 630 159" fill="none" stroke="#b64d3b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-b64d3b)"/><text x="180" y="241" font-size="13" font-weight="700" fill="#18344d" text-anchor="start">Rozjezd a vzdálenost</text><text x="482" y="188" font-size="13" font-weight="700" fill="#b64d3b" text-anchor="start">Stoupání a překážky</text><text x="55" y="123" font-size="15" font-weight="700" fill="#18344d" text-anchor="start">Elevace: 457 m / 1 500 ft</text><text x="55" y="151" font-size="21" font-weight="700" fill="#b64d3b" text-anchor="start">DA ≈ 1 220 m / 4 000 ft</text><text x="400" y="337" font-size="13" font-weight="700" fill="#60778a" text-anchor="middle">Žádné odhadnuté vzdálenosti vzletu: použij AFM/POH a rezervy.</text></g></svg>
