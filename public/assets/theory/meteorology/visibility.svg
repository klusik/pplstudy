<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">Dohlednost, RVR a ceiling</title><desc id="desc">Schéma rozlišuje převládající dohlednost, výhled z kokpitu, RVR podél dráhy a výšku základny oblačnosti.</desc><!-- Author: Rudolf Klusal. Original educational diagram. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-dfac39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfac39"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="31" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">Dohlednost, RVR a ceiling</text><rect x="35" y="54" width="730" height="251" rx="8" fill="#fff" stroke="#b8cbd7"/><rect x="50" y="245" width="700" height="43" rx="0" fill="#abc2a7" stroke="none"/><line x1="85" y1="244" x2="700" y2="244" stroke="#18344d" stroke-width="3" /><path d="M191 148 L213 142 L223 125 H230 L227 142 L254 145 L260 150 L227 154 L223 161 H217 L215 154 L195 152Z" fill="#18344d" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(250 72) scale(2.2)"><path d="M0 38 C-10 20 10 10 24 16 C28 -5 54 -8 65 13 C82 -1 107 13 100 30 Q115 48 93 48 H13 Q0 48 0 38Z" fill="#fff" stroke="#b8cbd7" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /></g><line x1="80" y1="129" x2="720" y2="129" stroke="#2376ae" stroke-width="2" stroke-dasharray="7 5"/><line x1="615" y1="243" x2="615" y2="131" stroke="#2376ae" stroke-width="3" marker-end="url(#arrow-2376ae)" stroke-linecap="round"/><text x="620" y="200" font-size="13" font-weight="400" fill="#2376ae" text-anchor="start">ceiling</text><line x1="90" y1="228" x2="400" y2="228" stroke="#198568" stroke-width="3" marker-end="url(#arrow-198568)" stroke-linecap="round"/><text x="135" y="215" font-size="14" font-weight="700" fill="#198568" text-anchor="start">převládající dohlednost</text><line x1="250" y1="145" x2="405" y2="145" stroke="#7958a0" stroke-width="3" marker-end="url(#arrow-7958a0)" stroke-linecap="round"/><text x="270" y="167" font-size="13" font-weight="400" fill="#7958a0" text-anchor="start">letová dohlednost</text><line x1="435" y1="258" x2="680" y2="258" stroke="#b64d3b" stroke-width="3" marker-end="url(#arrow-b64d3b)" stroke-linecap="round"/><text x="470" y="285" font-size="13" font-weight="700" fill="#b64d3b" text-anchor="start">RVR konkrétní dráhy</text><text x="400" y="337" font-size="13" font-weight="700" fill="#60778a" text-anchor="middle">Dohlednost je horizontální údaj; ceiling je vertikální výška.</text></g></svg>
