<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Tlaková výška: stejný tlak, jiné nastavení</title><desc id="desc">Na letišti s elevací 457 m a QNH 1003 hPa změna nastavení na STD zvyšuje indikaci na přibližně 539 m nebo 1770 ft, aniž se letadlo pohne.</desc><!-- Author: Rudolf Klusal. --><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui,sans-serif" fill="#18344d"><text x="25" y="30" font-size="21" font-weight="700">Tlaková výška (PA): stejné letiště</text><rect x="35" y="55" width="345" height="176" rx="12" fill="#fff" stroke="#b8cbd7"/><rect x="420" y="55" width="345" height="176" rx="12" fill="#fff" stroke="#b8cbd7"/><text x="207" y="86" text-anchor="middle" font-size="16" font-weight="700">Místní QNH</text><text x="592" y="86" text-anchor="middle" font-size="16" font-weight="700">Standardní nastavení STD</text><rect x="70" y="99" width="275" height="42" rx="7" fill="#e5f1f9"/><rect x="455" y="99" width="275" height="42" rx="7" fill="#e5f1f9"/><text x="207" y="127" font-size="23" font-weight="700" text-anchor="middle">1003 hPa</text><text x="592" y="127" font-size="23" font-weight="700" text-anchor="middle">1013,25 hPa</text><text x="207" y="177" text-anchor="middle" font-size="23" font-weight="700" fill="#2376ae">457 m / 1 500 ft</text><text x="592" y="177" text-anchor="middle" font-size="23" font-weight="700" fill="#b64d3b">≈ 539 m / 1 770 ft</text><text x="207" y="205" text-anchor="middle" font-size="14">Indikovaná elevace</text><text x="592" y="205" text-anchor="middle" font-size="14">Tlaková výška</text><path d="M382 120 H416" stroke="#2376ae" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="277" width="710" height="23" fill="#abc2a7"/><path d="M120 277h560" stroke="#60778a" stroke-width="7"/><path d="M365 261l22 -4 8 -17h6l-2 17 35 3 6 5-39 4-3 9h-7l-2 -9-25 -4z" fill="#18344d"/><text x="400" y="254" text-anchor="middle" font-size="13" font-weight="700">Změna indikace ≈ 82 m / 270 ft</text><text x="400" y="322" text-anchor="middle" font-size="15" font-weight="700">Poloha letadla a skutečný statický tlak se nezměnily.</text><text x="400" y="343" text-anchor="middle" font-size="12" fill="#60778a">Orientační výpočet s STD zaokrouhleným na 1013 hPa.</text></g></svg>
