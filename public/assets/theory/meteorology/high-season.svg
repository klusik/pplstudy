<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="title desc"><title id="title">Tlaková výše v létě a v zimě</title><desc id="desc">Letní výše může přinášet termiku a vysokou hustotní výšku; zimní výše může uzavřít vlhkost pod inverzí.</desc><!-- Author: Rudolf Klusal. Original educational diagram. --><defs><marker id="arrow-2376ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2376ae"/></marker><marker id="arrow-b64d3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b64d3b"/></marker><marker id="arrow-198568" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#198568"/></marker><marker id="arrow-60778a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60778a"/></marker><marker id="arrow-18344d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#18344d"/></marker><marker id="arrow-7958a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7958a0"/></marker><marker id="arrow-dfac39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfac39"/></marker></defs><rect width="800" height="360" fill="#f5f9fc"/><g font-family="system-ui, sans-serif"><text x="24" y="31" font-size="21" font-weight="700" fill="#18344d" text-anchor="start">Tlaková výše v létě a v zimě</text><rect x="30" y="54" width="360" height="250" rx="8" fill="#fff" stroke="#b8cbd7"/><text x="210" y="79" font-size="16" font-weight="700" fill="#18344d" text-anchor="middle">Letní výše</text><rect x="410" y="54" width="360" height="250" rx="8" fill="#fff" stroke="#b8cbd7"/><text x="590" y="79" font-size="16" font-weight="700" fill="#18344d" text-anchor="middle">Zimní výše</text><rect x="45" y="257" width="330" height="35" rx="0" fill="#abc2a7" stroke="none"/><rect x="425" y="257" width="330" height="35" rx="0" fill="#abc2a7" stroke="none"/><circle cx="100" cy="121" r="23" fill="#dfac39" stroke="none"/><g transform="translate(187 135) scale(0.75)"><path d="M0 38 C-10 20 10 10 24 16 C28 -5 54 -8 65 13 C82 -1 107 13 100 30 Q115 48 93 48 H13 Q0 48 0 38Z" fill="#fff" stroke="#b8cbd7" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /></g><line x1="236" y1="245" x2="236" y2="190" stroke="#b64d3b" stroke-width="3" marker-end="url(#arrow-b64d3b)" stroke-linecap="round"/><line x1="320" y1="111" x2="320" y2="200" stroke="#2376ae" stroke-width="3" marker-end="url(#arrow-2376ae)" stroke-linecap="round"/><text x="55" y="286" font-size="13" font-weight="700" fill="#18344d" text-anchor="start">Termika, horko, vyšší DA</text><rect x="425" y="212" width="330" height="45" rx="0" fill="#dfe6eb" stroke="none"/><line x1="425" y1="200" x2="755" y2="200" stroke="#b64d3b" stroke-width="3" stroke-dasharray="7 5"/><text x="438" y="193" font-size="15" font-weight="700" fill="#b64d3b" text-anchor="start">Inverze</text><line x1="650" y1="108" x2="650" y2="184" stroke="#2376ae" stroke-width="3" marker-end="url(#arrow-2376ae)" stroke-linecap="round"/><circle cx="475" cy="120" r="23" fill="#dfac39" stroke="none"/><text x="437" y="244" font-size="15" font-weight="700" fill="#60778a" text-anchor="start">Mlha / St</text><text x="435" y="286" font-size="13" font-weight="700" fill="#18344d" text-anchor="start">Nízká oblačnost může přetrvat</text><text x="400" y="337" font-size="13" font-weight="700" fill="#60778a" text-anchor="middle">Vysoký tlak sám o sobě není záruka VMC.</text></g></svg>
