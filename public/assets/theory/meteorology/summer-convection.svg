="590" y="80" font-size="16" font-weight="700" fill="#18344d" text-anchor="middle">Odpoledne</text><circle cx="92" cy="128" r="23" fill="#dfac39" stroke="none"/><g transform="translate(220 143) scale(0.8)"><path d="M0 38 C-10 20 10 10 24 16 C28 -5 54 -8 65 13 C82 -1 107 13 100 30 Q115 48 93 48 H13 Q0 48 0 38Z" fill="#fff" stroke="#b8cbd7" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /></g><line x1="45" y1="266" x2="375" y2="266" stroke="#198568" stroke-width="3" /><path d="M131 208 L153 202 L163 185 H170 L167 202 L194 205 L200 210 L167 214 L163 221 H157 L155 214 L135 212Z" fill="#18344d" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><text x="50" y="289" font-size="14" font-weight="700" fill="#18344d" text-anchor="start">Modelově CAVOK</text><path d="M500 227 Q462 202 505 174 Q479 134 531 128 Q530 91 580 94 L713 110 L674 130 L610 130 Q651 171 613 188 Q658 212 603 229Z" fill="#d6e3ec" stroke="#60778a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><line x1="530" y1="230" x2="525" y2="247" stroke="#2376ae" stroke-width="2" /><line x1="544" y1="230" x2="539" y2="247" stroke="#2376ae" stroke-width="2" /><line x1="558" y1="230" x2="553" y2="247" stroke="#2376ae" stroke-width="2" /><line x1="572" y1="230" x2="567" y2="247" stroke="#2376ae" stroke-width="2" /><line x1="586" y1="230" x2="581" y2="247" stroke="#2376ae" stroke-width="2" /><line x1="600" y1="230" x2="595" y2="247" stroke="#2376ae" stroke-width="2" /><line x1="614" y1="230" x2="609" y2="247" stroke="#2376ae" stroke-width="2" /><line x1="540" y1="254" x2="540" y2="146" stroke="#b64d3b" stroke-width="4" marker-end="url(#arrow-b64d3b)" stroke-linecap="round"/><line x1="611" y1="151" x2="611" y2="254" stroke="#2376ae" stroke-width="4" marker-end="url(#arrow-2376ae)" stroke-linecap="round"/><line x1="425" y1="266" x2="755" y2="266" stroke="#198568" stroke-width="3" /><text x="432" y="289" font-size="14" font-weight="700" fill="#b64d3b" text-anc