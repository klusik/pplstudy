oke="#7958a0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="595" cy="153" r="4" fill="#2376ae" stroke="none"/><path d="M617 144v18 M609 153h16 M611 147l12 12 M611 159l12 -12" fill="none" stroke="#7958a0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><line x1="590" y1="168" x2="590" y2="221" stroke="#7958a0" stroke-width="3" marker-end="url(#arrow-7958a0)" stroke-linecap="round"/><path d="M590 226v36 M572 244h36 M578 232l24 24 M578 256l24 -24" fill="none" stroke="#7958a0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="590" y="280" font-size="14" font-weight="700" fill="#18344d" text-anchor="middle">Růst ledových krystalků</text><text x="400" y="337" font-size="13" font-weight="700" fill="#60778a" text-anchor="middle">Srážková částice padá, když její pádová rychlost převáží výstup vzduchu.</text></g></svg>
